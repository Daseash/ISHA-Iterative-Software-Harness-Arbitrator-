[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isha-fix"
version = "0.2.0"
description = "Autonomous AI Software Engineering Agent with TDD Red-to-Green Verification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ISHA Team"}]

dependencies = [
    "langgraph",
    "litellm",
    "qdrant-client",
    "tree-sitter",
    "tree-sitter-python",
    "docling",
    "nemoguardrails",
    "langfuse",
    "pydantic>=2",
    "pytest",
    "docker",
    "streamlit",
    "laya",
    "python-dotenv",
    "swebench",
]

[project.scripts]
isha = "src.main:main"
isha-fix = "src.main:main"

# The import package is literally `src` (lives at the repo root). Without this,
# setuptools' auto-discovery treats src/ as a PEP "src layout" container and
# flattens its contents to the wheel root, breaking `import src.main`.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pyright]
extraPaths = [
    ".",
    "src",
    "tests/dummy_repo"
]

