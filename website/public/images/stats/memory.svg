  <g transform="translate(40, 510)">
    <rect width="250" height="70" rx="16" fill="rgba(0,0,0,0.25)" />
    <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="rgba(255,255,255,0.7)">VETO THRESHOLD</text>
    <text x="20" y="54" font-family="'Bricolage Grotesque', sans-serif" font-size="24" font-weight="900" fill="#fff">Cos &gt; 0.92</text>

    <rect x="270" width="250" height="70" rx="16" fill="rgba(0,0,0,0.25)" />
    <text x="290" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="rgba(255,255,255,0.7)">WASTED RUNS SAVED</text>
    <text x="290" y="54" font-family="'Bricolage Grotesque', sans-serif" font-size="24" font-weight="900" fill="#fff">142 Container Re-runs</text>
