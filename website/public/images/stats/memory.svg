  <text x="40" y="630" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="rgba(255,255,255,0.75)">AUDIT: isha-agent/src/memory/store.py &amp; tests/test_veto.py</text>
  <text x="40" y="650" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="rgba(255,255,255,0.5)">Persistent SQLite WAL store prevents repeating graded mistakes</text>
