        <text x="10" y="14" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#fff">✕</text>
        <text x="30" y="14" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" fill="#ef4444">NEGATIVE VETO TRIGGERED</text>
        <text x="0" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.9)">Candidate Cosine Similarity: <tspan fill="#ef4444" font-weight="bold">0.941</tspan> (&gt; 0.92 threshold)</text>
        <text x="0" y="64" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(255,255,255,0.6)">Matched known regression: AttributeError on NoneType in compiler.py</text>
        <text x="0" y="82" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#34d399">→ Candidate automatically aborted before container execution</text>
      </g>
    </g>
