      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
  </defs>

  <rect width="600" height="700" rx="36" fill="url(#memGrad)" />
  <rect x="20" y="20" width="560" height="660" rx="28" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <g transform="translate(40, 50)">
    <rect width="210" height="32" rx="16" fill="rgba(0,0,0,0.3)" />
    <circle cx="20" cy="16" r="5" fill="#fda4af" />
    <text x="35" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#fff" letter-spacing="1">PERSISTENT LEDGER</text>
  </g>
  <text x="560" y="72" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="rgba(255,255,255,0.6)">data/memory.db</text>

  <text x="40" y="145" font-family="'Bricolage Grotesque', sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-2">546</text>
  <text x="210" y="125" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="900" fill="#fda4af">OUTCOMES</text>
  <text x="40" y="180" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#fecdd3" letter-spacing="0.5">384-D SEMANTIC EMBEDDING LEDGER • VETO COS &gt; 0.92</text>

  <!-- Vector Veto Visualizer -->
  <g transform="translate(40, 220)">
    <rect width="520" height="260" rx="20" fill="rgba(0,0,0,0.35)" />
    
    <!-- Database stats -->
    <g transform="translate(25, 25)">
      <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#fda4af">SQLite WAL-Mode Experience Store</text>
      <text x="0" y="38" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.8)">• 546 graded benchmark outcomes across 10 sessions</text>
      <text x="0" y="58" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.8)">• 384-dimensional MiniLM semantic error vectors</text>
    </g>

    <!-- Hard Veto Simulation Box -->
    <g transform="translate(25, 110)">
      <rect width="470" height="120" rx="14" fill="rgba(0,0,0,0.3)" stroke="#ef4444" stroke-width="1.5" />
      <g transform="translate(20, 25)">
