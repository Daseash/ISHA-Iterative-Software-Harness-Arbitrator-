      <text x="50" y="28" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#fff">Strategy: call_site_aware</text>
      <text x="50" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(255,255,255,0.7)">AST Parse: PASS • 3 hunks • Repair round 1</text>
