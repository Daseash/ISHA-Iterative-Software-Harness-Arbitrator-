      <text x="50" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(255,255,255,0.7)">AST Parse: PASS • 1 hunk • Churn penalty: -0.02</text>
      <rect x="370" y="18" width="85" height="24" rx="6" fill="#10b981" />
