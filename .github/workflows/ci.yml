name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Test suite
        run: python -m pytest --ignore=tests/dummy_repo -q

      - name: CLI smoke (offline brain, no keys needed)
        run: |
          ISHA_FORCE_OFFLINE=1 python -c "from src.cli import _parser; _parser().parse_args(['bench', '--help'])"
