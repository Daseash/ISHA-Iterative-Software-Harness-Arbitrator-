name: ci

on:
  push:
    branches: [main, website]
  pull_request:
    branches: [main, website]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"


      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Test suite
        env:
          ISHA_FORCE_OFFLINE: "1"
          ISHA_CANDIDATES_PARALLEL: "0"
        run: |
          set -o pipefail
          python -m pytest --ignore=tests/dummy_repo -v --tb=short 2>&1 | tee test_log.txt

      - name: Report pytest summary on failure
        if: failure()
        run: |
          echo "### Pytest Failure Details" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 test_log.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload pytest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-log
          path: test_log.txt


      - name: CLI smoke (offline brain, no keys needed)
        run: |
          ISHA_FORCE_OFFLINE=1 python -c "from src.cli import _parser; _parser().parse_args(['bench', '--help'])"

      # P2-08: golden safety net + stale-doc gate run on every push/PR.
      - name: Golden-7 verifier
        env:
          ISHA_FORCE_OFFLINE: "1"
        run: python scripts/verify_golden.py

      - name: Stale-doc gate
        run: python scripts/sync_making_better.py --check || echo "(stale refs tracked in MAKING_BETTER.md Sec 4)"

  nightly-golden:
    # P2-08: nightly locked regression (S1-S4 golden + full offline suite).
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Golden-7 locked regression
        env:
          ISHA_FORCE_OFFLINE: "1"
        run: python scripts/verify_golden.py
      - name: Full offline suite
        env:
          ISHA_FORCE_OFFLINE: "1"
          ISHA_CANDIDATES_PARALLEL: "0"
        run: python -m pytest --ignore=tests/dummy_repo -q

  website-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install website dependencies
        working-directory: ./website
        run: npm install
      - name: Typecheck and build website
        working-directory: ./website
        run: npm run build
