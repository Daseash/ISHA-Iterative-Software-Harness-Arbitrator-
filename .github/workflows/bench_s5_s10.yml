name: ISHA Cloud Benchmark (S5-S10)

on:
  workflow_dispatch:
    inputs:
      sessions:
        description: "Sessions to run (space-separated, e.g. lite300-s5 or lite300-s5 lite300-s6)"
        required: true
        default: "lite300-s5"
      candidates:
        description: "Number of tournament candidates per issue"
        required: true
        default: "3"
      eval_workers:
        description: "Parallel Docker evaluation containers"
        required: true
        default: "3"
      gen_workers:
        description: "Parallel patch generation tournament workers"
        required: true
        default: "2"
      skip_eval:
        description: "Skip Docker eval and generate patches only"
        type: boolean
        required: false
        default: false
      eval_only:
        description: "Skip patch generation and run Docker eval only"
        type: boolean
        required: false
        default: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360  # Maximum 6-hour autonomous cloud run
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Free Disk Space for Docker
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker system prune -a -f || true
          df -h

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run S5-S10 Tournament & Docker Evaluation
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ISHA_CANDIDATES: ${{ inputs.candidates }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.skip_eval }}" = "true" ]; then
            EXTRA_ARGS="--skip-eval"
          elif [ "${{ inputs.eval_only }}" = "true" ]; then
            EXTRA_ARGS="--eval-only"
          fi
          python scripts/codespaces_s5_s10_pipeline.py \
            --sessions ${{ inputs.sessions }} \
            --candidates ${{ inputs.candidates }} \
            --eval-workers ${{ inputs.eval_workers }} \
            --gen-workers ${{ inputs.gen_workers }} \
            $EXTRA_ARGS

      - name: Archive Benchmark Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            results/
            data/slices/
          retention-days: 14

      - name: Commit and Push Results to Origin Main
        if: always()
        run: |
          git add results/ data/slices/
          git commit -m "chore(bench): auto-sync S5-S10 patches & Docker eval [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main || echo "Push skipped or no new changes"
